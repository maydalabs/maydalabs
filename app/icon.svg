<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 32 32"
>
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ml-bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1f3b4a" />
      <stop offset="100%" stop-color="#60a4ba" />
    </linearGradient>
  </defs>

  <!-- Outer tile -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="9"
    fill="url(#ml-bg)"
    stroke="#1f2933"
    stroke-width="1"
  />

  <!-- Growth bars -->
  <rect x="8" y="18" width="4" height="7" rx="2" fill="url(#ml-bars)" />
  <rect x="14" y="14" width="4" height="11" rx="2" fill="url(#ml-bars)" />
  <rect x="20" y="10" width="4" height="15" rx="2" fill="url(#ml-bars)" />

  <!-- Signal curve -->
  <path
    d="M7 12.5 C 11 9.5, 15 9.5, 19 11 C 21 11.7, 23 13, 25 15"
    fill="none"
    stroke="#64748b"
    stroke-width="1.1"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Signal dot -->
  <circle cx="24.5" cy="14.5" r="1.3" fill="#60a4ba" />
</svg>
